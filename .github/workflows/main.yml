name: Sync GitHub to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: https://huggingface.co/spaces/kaiozwald/reachy_mini_conversation_app_local/tree/main/src/reachy_mini_conversation_app
          hf_token: ${{ secrets.HF_TOKEN }}
